<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="tagline" x1="0" y1="0" x2="300" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a1a1aa"/>
      <stop offset="100%" stop-color="#71717a"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow3" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" fill="url(#bg)"/>

  <!-- Aurora orbs -->
  <ellipse cx="150" cy="80" rx="200" ry="150" fill="url(#glow1)" filter="url(#blur1)"/>
  <ellipse cx="750" cy="220" rx="180" ry="130" fill="url(#glow2)" filter="url(#blur1)"/>
  <ellipse cx="450" cy="150" rx="250" ry="100" fill="url(#glow3)" filter="url(#blur2)"/>

  <!-- Grid lines (subtle) -->
  <line x1="0" y1="50" x2="900" y2="50" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
  <line x1="0" y1="100" x2="900" y2="100" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
  <line x1="0" y1="150" x2="900" y2="150" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
  <line x1="0" y1="200" x2="900" y2="200" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
  <line x1="0" y1="250" x2="900" y2="250" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
  <line x1="100" y1="0" x2="100" y2="300" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="300" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="300" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="300" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
  <line x1="500" y1="0" x2="500" y2="300" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="300" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
  <line x1="700" y1="0" x2="700" y2="300" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="300" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>

  <!-- Brain/circuit icon -->
  <g transform="translate(310, 85)" opacity="0.9">
    <!-- Brain outline -->
    <path d="M40 10 C20 10, 5 25, 5 45 C5 60, 15 70, 25 75 L25 85 L55 85 L55 75 C65 70, 75 60, 75 45 C75 25, 60 10, 40 10Z" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.6"/>
    <!-- Neural connections -->
    <circle cx="25" cy="35" r="3" fill="#a855f7" opacity="0.8"/>
    <circle cx="40" cy="25" r="3" fill="#c084fc" opacity="0.8"/>
    <circle cx="55" cy="35" r="3" fill="#3b82f6" opacity="0.8"/>
    <circle cx="30" cy="55" r="3" fill="#a855f7" opacity="0.6"/>
    <circle cx="50" cy="55" r="3" fill="#3b82f6" opacity="0.6"/>
    <circle cx="40" cy="45" r="2.5" fill="#06b6d4" opacity="0.8"/>
    <!-- Connection lines -->
    <line x1="25" y1="35" x2="40" y2="25" stroke="#a855f7" stroke-width="0.8" opacity="0.5"/>
    <line x1="40" y1="25" x2="55" y2="35" stroke="#c084fc" stroke-width="0.8" opacity="0.5"/>
    <line x1="25" y1="35" x2="30" y2="55" stroke="#a855f7" stroke-width="0.8" opacity="0.4"/>
    <line x1="55" y1="35" x2="50" y2="55" stroke="#3b82f6" stroke-width="0.8" opacity="0.4"/>
    <line x1="30" y1="55" x2="40" y2="45" stroke="#06b6d4" stroke-width="0.8" opacity="0.4"/>
    <line x1="50" y1="55" x2="40" y2="45" stroke="#06b6d4" stroke-width="0.8" opacity="0.4"/>
    <line x1="40" y1="25" x2="40" y2="45" stroke="#a855f7" stroke-width="0.8" opacity="0.3"/>
  </g>

  <!-- Title -->
  <text x="450" y="175" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="url(#title)" letter-spacing="-1">
    RepoMind
  </text>

  <!-- Tagline -->
  <text x="450" y="215" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="url(#tagline)" letter-spacing="0.5">
    30秒读懂任何 GitHub 项目
  </text>

  <!-- Bottom accent line -->
  <rect x="350" y="240" width="200" height="1" rx="0.5" fill="url(#title)" opacity="0.3"/>

  <!-- Subtle corner decorations -->
  <rect x="20" y="20" width="30" height="1" fill="#a855f7" opacity="0.2"/>
  <rect x="20" y="20" width="1" height="30" fill="#a855f7" opacity="0.2"/>
  <rect x="850" y="20" width="30" height="1" fill="#3b82f6" opacity="0.2"/>
  <rect x="879" y="20" width="1" height="30" fill="#3b82f6" opacity="0.2"/>
  <rect x="20" y="279" width="30" height="1" fill="#a855f7" opacity="0.2"/>
  <rect x="20" y="250" width="1" height="30" fill="#a855f7" opacity="0.2"/>
  <rect x="850" y="279" width="30" height="1" fill="#3b82f6" opacity="0.2"/>
  <rect x="879" y="250" width="1" height="30" fill="#3b82f6" opacity="0.2"/>
</svg>
